t x="523" y="178" font-size="10.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">其余分支连同 KV 丢弃</text><line x1="616" y1="130" x2="660" y2="130" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><circle cx="700" cy="130" r="22" fill="#e6f4ec" stroke="#2f7d5a" stroke-width="1.5"/><text x="700" y="134" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">a</text><circle cx="760" cy="130" r="22" fill="#e6f4ec" stroke="#2f7d5a" stroke-width="1.5"/><text x="760" y="134" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">aa</text><circle cx="820" cy="130" r="22" fill="#e6f4ec" stroke="#2f7d5a" stroke-width="1.5"/><text x="820" y="134" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">+1</text><text x="760" y="178" font-size="10" text-anchor="middle" fill="#2f7d5a" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">目标模型补出的 bonus token</text><text x="450" y="336" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">接受 a、aa 两个草稿 token，再加 1 个 bonus token：一次前向完成 3 步解码</text><text x="450" y="362" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">代价：被拒绝分支的 KV 计算全部浪费；batch 越大，验证前向越接近计算受限</text>
