ont-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">1</text><text x="82" y="224.39999999999998" font-size="10" text-anchor="end" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">10</text><text x="82" y="169.6" font-size="10" text-anchor="end" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">100</text><text x="82" y="114.79999999999998" font-size="10" text-anchor="end" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">1000</text><text x="82" y="60.0" font-size="10" text-anchor="end" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">10000</text><text x="70" y="44" font-size="10" text-anchor="end" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">TFLOP/s</text><line x1="90.0" y1="280.5106687128415" x2="802.0517258346836" y2="77.80711247522765" stroke="#2f7d5a" stroke-width="2.2"/><line x1="802.0517258346836" y1="77.80711247522765" x2="860" y2="77.80711247522765" stroke="#2f7d5a" stroke-width="2.2" stroke-dasharray="7 4"/><text x="858" y="70.80711247522765" font-size="9.5" text-anchor="end" fill="#2f7d5a" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">三代：4000 TFLOPS</text><line x1="90.0" y1="301.2275445743809" x2="758.0041607778643" y2="111.06324322047453" stroke="#3b6ea5" stroke-width="2.2"/><line x1="758.0041607778643" y1="111.06324322047453" x2="860" y2="111.06324322047453" stroke="#3b6ea5" stroke-width="2.2" stroke-dasharray="7 4"/><text x="858" y="104.06324322047453" font-size="9.5" text-anchor="end" fill="#3b6ea5" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">二代：989 TFLOPS</text><line x1="90.0" y1="313.50355623761385" x2="725.4482741653164" y2="132.60711247522764" stroke="#b07d2b" stroke-width="2.2"/><line x1="725.4482741653164" y1="132.60711247522764" x2="860" y2="132.60711247522764" stroke="#b07d2b" stroke-width="2.2" stroke-dasharray="7 4"/><text x="858" y="125.60711247522764" font-size="9.5" text-anchor="end" fill="#b07d2b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">一代：400 TFLOPS</text><circle cx="340.4482741653164" cy="249.05375524136247" r="5.5" fill="#fbe9e9" stroke="#b23b3b" stroke-width="1.5"/><text x="350.4482741653164" y="253.05375524136247" font-size="10.5" text-anchor="start" fill="#b23b3b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">decode 工作点（强度约 1–2）</text><text x="450" y="388" font-size="10" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">横轴与纵轴均为对数刻度；虚线为各代的算力上限</text>
