<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="张量并行的通信模式">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="900" height="420" fill="#ffffff"/>
<rect x="60" y="60" width="380" height="300" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="250" y="86" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">Rank 0</text><rect x="100" y="108" width="300" height="56" rx="6" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="250.0" y="134.0" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">列并行：QKV / MLP up</text><text x="250.0" y="153.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">每卡持有 1/2 的输出列</text><rect x="100" y="190" width="300" height="56" rx="6" fill="#e6f4ec" stroke="#2f7d5a" stroke-width="1.5"/><text x="250.0" y="216.0" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">行并行：O / MLP down</text><text x="250.0" y="235.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">每卡持有 1/2 的输入行</text><line x1="250" y1="164" x2="250" y2="190" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><rect x="480" y="60" width="380" height="300" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="670" y="86" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">Rank 1</text><rect x="520" y="108" width="300" height="56" rx="6" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="670.0" y="134.0" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">列并行：QKV / MLP up</text><text x="670.0" y="153.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">每卡持有 1/2 的输出列</text><rect x="520" y="190" width="300" height="56" rx="6" fill="#e6f4ec" stroke="#2f7d5a" stroke-width="1.5"/><text x="670.0" y="216.0" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">行并行：O / MLP down</text><text x="670.0" y="235.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">每卡持有 1/2 的输入行</text><line x1="670" y1="164" x2="670" y2="190" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><line x1="440" y1="136" x2="480" y2="136" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><rect x="300" y="272" width="300" height="50" rx="6" fill="#f3e8fd" stroke="#7c4dab" stroke-width="1.5"/><text x="450.0" y="295.0" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">All-reduce（每层 2 次）</text><text x="450.0" y="314.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">16 KB / rank，约 5 µs</text><line x1="250" y1="246" x2="330" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><line x1="650" y1="246" x2="570" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><line x1="450" y1="322" x2="450" y2="356" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><rect x="330" y="356" width="240" height="46" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="450.0" y="377.0" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">残差相加</text><text x="450.0" y="396.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">结果在所有 rank 上一致</text><text x="450" y="40" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">张量并行：列并行后接行并行，只在块边界做一次 all-reduce</text>
</svg>
