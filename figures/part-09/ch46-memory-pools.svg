<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="推理服务的显存池划分">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="900" height="300" fill="#ffffff"/>
<text x="450" y="32" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">8×H100（640 GB）部署 70B 的显存划分</text><rect x="40" y="62" width="179.375" height="64" rx="0" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="129.6875" y="100" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">权重 140 GB</text><rect x="219.375" y="62" width="512.5" height="64" rx="0" fill="#e6f4ec" stroke="#2f7d5a" stroke-width="1.5"/><text x="475.625" y="100" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">KV Cache 400 GB</text><rect x="731.875" y="62" width="51.25" height="64" rx="0" fill="#fdf1d6" stroke="#b07d2b" stroke-width="1.5"/><rect x="783.125" y="62" width="25.625" height="64" rx="0" fill="#f3e8fd" stroke="#7c4dab" stroke-width="1.5"/><rect x="808.75" y="62" width="51.25" height="64" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="40" y="146" font-size="10" text-anchor="start" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">0</text><text x="860" y="146" font-size="10" text-anchor="end" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">640 GB</text><line x1="40" y1="140" x2="860" y2="140" stroke="#94a3b8" stroke-width="1.5"/><rect x="40" y="172" width="13" height="13" rx="3" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="59" y="183" font-size="10.5" text-anchor="start" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">权重 140 GB</text><rect x="158.5" y="172" width="13" height="13" rx="3" fill="#e6f4ec" stroke="#2f7d5a" stroke-width="1.5"/><text x="177.5" y="183" font-size="10.5" text-anchor="start" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">KV Cache 400 GB</text><rect x="340.0" y="172" width="13" height="13" rx="3" fill="#fdf1d6" stroke="#b07d2b" stroke-width="1.5"/><text x="359.0" y="183" font-size="10.5" text-anchor="start" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">激活 40 GB</text><rect x="448.0" y="172" width="13" height="13" rx="3" fill="#f3e8fd" stroke="#7c4dab" stroke-width="1.5"/><text x="467.0" y="183" font-size="10.5" text-anchor="start" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">context 20 GB</text><rect x="608.5" y="172" width="13" height="13" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="627.5" y="183" font-size="10.5" text-anchor="start" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">预留 40 GB</text><text x="450" y="226" font-size="11" text-anchor="middle" fill="#2f7d5a" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">KV Cache 决定并发上限：每 token 320 KiB，400 GB 约合 128 万 token；8K 请求约占 2.6 GB</text><text x="450" y="254" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">启动时按可用显存的 85%–90% 一次性预分配，运行中不再申请大块</text><text x="450" y="280" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">碎片是这个划分的慢性病：总量够，但拼不出连续的大块</text>
</svg>
