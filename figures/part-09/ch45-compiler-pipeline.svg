<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" width="900" height="316" role="img" aria-label="torch.compile 的编译流水线">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="900" height="316" fill="#ffffff"/>
<rect x="30" y="60" width="150" height="84" rx="6" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="105.0" y="100.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">Dynamo</text><text x="105.0" y="119.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">捕获 FX 图</text><line x1="180" y1="102" x2="198" y2="102" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><rect x="198" y="60" width="150" height="84" rx="6" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="273.0" y="100.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">AOTAutograd</text><text x="273.0" y="119.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">分离前向反向</text><line x1="348" y1="102" x2="366" y2="102" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><rect x="366" y="60" width="150" height="84" rx="6" fill="#e6f4ec" stroke="#2f7d5a" stroke-width="1.5"/><text x="441.0" y="100.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">Inductor</text><text x="441.0" y="119.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">融合 + 下沉</text><line x1="516" y1="102" x2="534" y2="102" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><rect x="534" y="60" width="150" height="84" rx="6" fill="#fdf1d6" stroke="#b07d2b" stroke-width="1.5"/><text x="609.0" y="100.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">Triton</text><text x="609.0" y="119.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">生成 kernel</text><line x1="684" y1="102" x2="702" y2="102" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><rect x="702" y="60" width="150" height="84" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="777.0" y="100.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">PTX / cubin</text><text x="777.0" y="119.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">GPU 执行</text><rect x="30" y="196" width="840" height="62" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="60" y="220" font-size="11" text-anchor="start" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">分支：矩阵乘走 cuBLAS（extern kernel），elementwise 链走 Triton</text><text x="60" y="244" font-size="11" text-anchor="start" fill="#b23b3b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">图断裂（graph break）会把这一段退回 eager，前后的融合机会同时丢失</text><text x="450" y="296" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">编译收益主要来自融合和 launch 开销消除，不改变 GEMM 本身的效率</text>
</svg>
