<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" role="img" aria-label="FlashAttention 分块循环">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="900" height="425" fill="#ffffff"/>
<text x="110" y="62" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">Q 块（外层循环）</text><rect x="60" y="78" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="110.0" y="99.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">Q0</text><text x="110.0" y="118.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">128×128</text><rect x="60" y="140" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="110.0" y="161.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">Q1</text><text x="110.0" y="180.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">128×128</text><rect x="60" y="202" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="110.0" y="223.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">Q2</text><text x="110.0" y="242.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">128×128</text><rect x="60" y="264" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="110.0" y="285.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">Q3</text><text x="110.0" y="304.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">128×128</text><text x="430" y="62" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">内层循环：遍历全部 K/V 块</text><rect x="330" y="78" width="240" height="240" rx="6" fill="#fbfdff" stroke="#3b6ea5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="450" y="104" font-size="12" text-anchor="middle" fill="#3b6ea5" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">维护运行状态</text><text x="450" y="132" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">m  ：行最大值（在线）</text><text x="450" y="158" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">l  ：归一化和</text><text x="450" y="184" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">acc：未归一化输出</text><text x="450" y="222" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">S = Q·Kᵀ / √d</text><text x="450" y="246" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">P = exp(S − m)</text><text x="450" y="270" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">acc += P·V,  l += ΣP</text><text x="660" y="62" font-size="12" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">K/V 块</text><rect x="640" y="78" width="100" height="46" rx="6" fill="#fdf1d6" stroke="#b07d2b" stroke-width="1.5"/><text x="690.0" y="99.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">K0 V0</text><text x="690.0" y="118.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">128×128</text><rect x="640" y="140" width="100" height="46" rx="6" fill="#fdf1d6" stroke="#b07d2b" stroke-width="1.5"/><text x="690.0" y="161.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">K1 V1</text><text x="690.0" y="180.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">128×128</text><rect x="640" y="202" width="100" height="46" rx="6" fill="#fdf1d6" stroke="#b07d2b" stroke-width="1.5"/><text x="690.0" y="223.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">K2 V2</text><text x="690.0" y="242.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">128×128</text><rect x="640" y="264" width="100" height="46" rx="6" fill="#fdf1d6" stroke="#b07d2b" stroke-width="1.5"/><text x="690.0" y="285.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">K3 V3</text><text x="690.0" y="304.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">128×128</text><line x1="160" y1="101" x2="330" y2="101" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/><line x1="640" y1="101" x2="570" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)" stroke-dasharray="4 3"/><line x1="640" y1="163" x2="570" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)" stroke-dasharray="4 3"/><line x1="640" y1="225" x2="570" y2="250" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)" stroke-dasharray="4 3"/><line x1="640" y1="287" x2="570" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)" stroke-dasharray="4 3"/><rect x="330" y="340" width="240" height="46" rx="6" fill="#e6f4ec" stroke="#2f7d5a" stroke-width="1.5"/><text x="450.0" y="361.0" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">O = acc / l</text><text x="450.0" y="380.0" font-size="11.5" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">从不物化 S×S</text><text x="450" y="410" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">外层 4 个 Q 块 × 内层 4 个 K/V 块 = 16 次 tile 计算，显存只有 O(S·d)</text>
</svg>
