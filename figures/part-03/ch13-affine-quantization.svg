<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="仿射量化映射">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="900" height="410" fill="#ffffff"/>
<text x="105" y="95" font-size="11" text-anchor="end" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">实数轴</text><text x="105" y="215" font-size="11" text-anchor="end" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">int8 轴</text><line x1="120" y1="90" x2="790" y2="90" stroke="#94a3b8" stroke-width="1.8"/><line x1="120" y1="210" x2="790" y2="210" stroke="#94a3b8" stroke-width="1.8"/><line x1="120" y1="84" x2="120" y2="96" stroke="#94a3b8" stroke-width="1.8"/><text x="120" y="76" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">-α</text><line x1="285" y1="84" x2="285" y2="96" stroke="#94a3b8" stroke-width="1.8"/><text x="285" y="76" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">-0.5</text><line x1="450" y1="84" x2="450" y2="96" stroke="#94a3b8" stroke-width="1.8"/><text x="450" y="76" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">0</text><line x1="615" y1="84" x2="615" y2="96" stroke="#94a3b8" stroke-width="1.8"/><text x="615" y="76" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">0.5</text><line x1="780" y1="84" x2="780" y2="96" stroke="#94a3b8" stroke-width="1.8"/><text x="780" y="76" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">α</text><line x1="120" y1="204" x2="120" y2="216" stroke="#94a3b8" stroke-width="1.8"/><text x="120" y="234" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">-128</text><line x1="450" y1="204" x2="450" y2="216" stroke="#94a3b8" stroke-width="1.8"/><text x="450" y="234" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">0</text><line x1="616" y1="204" x2="616" y2="216" stroke="#94a3b8" stroke-width="1.8"/><text x="616" y="234" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">64</text><line x1="780" y1="204" x2="780" y2="216" stroke="#94a3b8" stroke-width="1.8"/><text x="780" y="234" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">127</text><line x1="120" y1="102" x2="120" y2="198" stroke="#3b6ea5" stroke-width="1.6" marker-end="url(#arw)"/><line x1="450" y1="102" x2="450" y2="198" stroke="#3b6ea5" stroke-width="1.6" marker-end="url(#arw)"/><line x1="615" y1="102" x2="616" y2="198" stroke="#3b6ea5" stroke-width="1.6" marker-end="url(#arw)"/><line x1="780" y1="102" x2="780" y2="198" stroke="#3b6ea5" stroke-width="1.6" marker-end="url(#arw)"/><rect x="60" y="262" width="780" height="108" rx="6" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="80" y="292" font-size="15" text-anchor="start" fill="#3b6ea5" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">q = clamp( round(x / s) + z,  -128, 127 )</text><text x="80" y="322" font-size="13" text-anchor="start" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">s = (max − min) / 255 = α / 127</text><text x="80" y="350" font-size="13" text-anchor="start" fill="#1e293b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">x̂ = (q − z) · s        对称量化时 z = 0；非对称量化用 z 把零点对齐</text><text x="450" y="392" font-size="11" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">s 决定分辨率，z 决定表示范围；离群值会把 s 撑大，压缩其余值的精度</text>
</svg>
