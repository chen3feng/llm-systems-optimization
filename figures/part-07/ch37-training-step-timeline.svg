 Sans SC, Microsoft YaHei, sans-serif">5</text><line x1="583.3333333333333" y1="60" x2="583.3333333333333" y2="250" stroke="#eef2f7" stroke-width="1.5"/><text x="583.3333333333333" y="268" font-size="10" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">6</text><line x1="665.5555555555555" y1="60" x2="665.5555555555555" y2="250" stroke="#eef2f7" stroke-width="1.5"/><text x="665.5555555555555" y="268" font-size="10" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">7</text><line x1="747.7777777777777" y1="60" x2="747.7777777777777" y2="250" stroke="#eef2f7" stroke-width="1.5"/><text x="747.7777777777777" y="268" font-size="10" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">8</text><line x1="830.0" y1="60" x2="830.0" y2="250" stroke="#eef2f7" stroke-width="1.5"/><text x="830.0" y="268" font-size="10" text-anchor="middle" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">9</text><line x1="90" y1="254" x2="830" y2="254" stroke="#94a3b8" stroke-width="1.2"/><text x="830" y="288" font-size="10" text-anchor="end" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">秒</text><rect x="90" y="70" width="197.33333333333334" height="40" rx="6" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/><text x="188.66666666666669" y="95.0" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">前向 2.4 s</text><rect x="287.33333333333337" y="70" width="394.6666666666667" height="40" rx="6" fill="#e6f4ec" stroke="#2f7d5a" stroke-width="1.5"/><text x="484.66666666666674" y="95.0" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">反向 4.8 s</text><rect x="780.6666666666666" y="70" width="24.666666666666668" height="40" rx="3" fill="#fdf1d6" stroke="#b07d2b" stroke-width="1.5"/><text x="780.6666666666666" y="58" font-size="10" text-anchor="middle" fill="#b07d2b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">优化器 0.3 s</text><rect x="287.33333333333337" y="140" width="94.66666666666667" height="32" rx="4" fill="#f3e8fd" stroke="#7c4dab" stroke-width="1.5" stroke-dasharray="5 3"/><text x="336.6666666666667" y="161" font-size="10" text-anchor="middle" fill="#7c4dab" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">AR0</text><rect x="386.0" y="140" width="94.66666666666667" height="32" rx="4" fill="#f3e8fd" stroke="#7c4dab" stroke-width="1.5" stroke-dasharray="5 3"/><text x="435.3333333333333" y="161" font-size="10" text-anchor="middle" fill="#7c4dab" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">AR1</text><rect x="484.6666666666667" y="140" width="94.66666666666667" height="32" rx="4" fill="#f3e8fd" stroke="#7c4dab" stroke-width="1.5" stroke-dasharray="5 3"/><text x="534.0" y="161" font-size="10" text-anchor="middle" fill="#7c4dab" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">AR2</text><rect x="583.3333333333333" y="140" width="94.66666666666667" height="32" rx="4" fill="#f3e8fd" stroke="#7c4dab" stroke-width="1.5" stroke-dasharray="5 3"/><text x="632.6666666666666" y="161" font-size="10" text-anchor="middle" fill="#7c4dab" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">AR3</text><rect x="682.0" y="140" width="123.33333333333333" height="32" rx="6" fill="#f3e8fd" stroke="#7c4dab" stroke-width="1.5"/><text x="743.6666666666666" y="161.0" font-size="10" text-anchor="middle" fill="#1e293b" font-weight="600" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">剩余 all-reduce</text><text x="90" y="204" font-size="11" text-anchor="start" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">梯度 bucket 反向后立即同步，和后续层的反向重叠；最后剩下的 1.5 s 无法重叠</text><text x="90" y="300" font-size="11" text-anchor="start" fill="#64748b" font-weight="400" font-family="PingFang SC, Noto Sans SC, Source Han Sans SC, Microsoft YaHei, sans-serif">关键问题：前向和反向各段之间是否有空隙？有的话是数据加载或通信没藏住</text>
</svg>
