name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mdBook 没有维护中的 setup action，直接用官方预编译包；版本与本地保持一致
      - name: Install mdBook
        run: |
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install mdbook-katex
        run: cargo install mdbook-katex

      - name: Install mdbook-epub
        run: cargo install mdbook-epub

      - name: Build book
        run: ./scripts/render.sh

      - name: Check formulas
        run: python3 -I scripts/check_math.py

      - name: Install CJK fonts and PDF tools
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk poppler-utils

      - name: Build PDFs
        run: python3 -I scripts/make_pdf.py

      - name: Upload HTML
        uses: actions/upload-artifact@v7
        with:
          name: book-html
          path: .build/html
          retention-days: 7

      - name: Upload EPUB
        uses: actions/upload-artifact@v7
        with:
          name: book-epub
          path: .build/llm-systems-optimization.epub
          retention-days: 7

      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: book-pdf
          path: |
            .build/llm-systems-optimization.pdf
            .build/llm-systems-optimization-kindle.pdf
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download EPUB
        uses: actions/download-artifact@v8
        with:
          name: book-epub
          path: dist

      - name: Download PDFs
        uses: actions/download-artifact@v8
        with:
          name: book-pdf
          path: dist

      - name: Publish latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: 最新书稿
          body: 自动构建的最新 EPUB 与 PDF（A4 普通版、6 寸 Kindle 大字版），每次合并到 main 后更新。
          files: |
            dist/llm-systems-optimization.epub
            dist/llm-systems-optimization.pdf
            dist/llm-systems-optimization-kindle.pdf
          make_latest: true
