name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install mdbook-katex
        run: cargo install mdbook-katex

      - name: Install mdbook-epub
        run: cargo install mdbook-epub

      - name: Build book
        run: ./scripts/render.sh

      - name: Check formulas
        run: python3 -I scripts/check_math.py

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: .build/html
          retention-days: 7

      - name: Upload EPUB
        uses: actions/upload-artifact@v4
        with:
          name: book-epub
          path: .build/llm-systems-optimization.epub
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download EPUB
        uses: actions/download-artifact@v4
        with:
          name: book-epub
          path: dist

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新书稿
          body: 自动构建的最新 EPUB，每次合并到 main 后更新。
          files: dist/llm-systems-optimization.epub
          make_latest: true
